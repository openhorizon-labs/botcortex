[project]
name = "botcortex"
version = "0.0.1"
description = "BotCortex — the robot's motor cortex. Teach your robot new tasks by typing."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "OpenHorizon Labs" }]
keywords = ["robotics", "llm-agents", "lerobot", "robot-learning"]
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
botcortex = "botcortex.cli:main"
bx = "botcortex.cli:main"

[project.urls]
Homepage = "https://openhorizon.so"
Repository = "https://github.com/openhorizon-labs/botcortex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
